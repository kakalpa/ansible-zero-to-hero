services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-ansible-lab-}portal:${IMAGE_TAG:-latest}
    container_name: ansible-portal
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORTAL_PORT:-8080}:8080"
    environment:
      - PORTAL_PORT=${PORTAL_PORT:-8080}
      - DOCKER_HOST=${DOCKER_HOST:-}
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ./workspace:/ansible/playbooks
      - ./custom_scenarios:/ansible/custom_scenarios
      - cluster-keys:/shared-keys
      - user-data:/ansible/user_data
    networks:
      ansible-net:
        aliases:
          - portal
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - node1-ubuntu
      - node2-debian
      - node3-debian13
      - node4-almalinux
      - node5-rocky
      - node6-alpine
      - node7-alpine

  node1-ubuntu:
    build:
      context: .
      dockerfile: docker/node-ubuntu.Dockerfile
    image: ${IMAGE_PREFIX:-ansible-lab-}node1-ubuntu:${IMAGE_TAG:-latest}
    container_name: node1-ubuntu
    hostname: node1-ubuntu
    restart: unless-stopped
    volumes:
      - cluster-keys:/shared-keys:ro
    networks:
      ansible-net:
        aliases:
          - node1-ubuntu
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  node2-debian:
