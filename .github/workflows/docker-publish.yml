name: Build and Publish Multi-Arch Container Images

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/ansible-lab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: portal
            dockerfile: Dockerfile
            context: .
          - image: node1-ubuntu
            dockerfile: docker/node-ubuntu.Dockerfile
            context: .
          - image: node2-debian
            dockerfile: docker/node-debian12.Dockerfile
            context: .
          - image: node3-debian13
            dockerfile: docker/node-debian13.Dockerfile
            context: .
          - image: node4-almalinux
            dockerfile: docker/node-almalinux.Dockerfile
            context: .
          - image: node5-rocky
            dockerfile: docker/node-rocky.Dockerfile
            context: .
          - image: node6-alpine
            dockerfile: docker/node-alpine.Dockerfile
            context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Tags
        id: meta
        run: |
          LOWERCASE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${{ env.REGISTRY }}/${LOWERCASE_OWNER}/ansible-lab-${{ matrix.image }}"
          TAG="${{ github.event.inputs.tag || github.ref_name || 'latest' }}"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and Push Multi-Arch Image (amd64 & arm64)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_name }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
