# Ansible Inventory for Practice Cluster (Docker & Proxmox compatible)

[ubuntu]
node1-ubuntu ansible_host=node1-ubuntu

[debian]
node2-debian ansible_host=node2-debian
node3-debian13 ansible_host=node3-debian13

[rhel]
node4-almalinux ansible_host=node4-almalinux
node5-rocky ansible_host=node5-rocky

[alpine]
node6-alpine ansible_host=node6-alpine ansible_python_interpreter=/usr/bin/python3

# Hierarchical Groupings
[debian_family:children]
ubuntu
debian

[cluster:children]
debian_family
rhel
alpine

# Global Connection Variables
[all:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/master
ansible_ssh_common_args=-o StrictHostKeyChecking=no
